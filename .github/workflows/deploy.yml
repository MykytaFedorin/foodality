name: Build & Test Foodality PWA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest Automated Tests
        run: npm run test

      - name: Build Vite React PWA
        run: npm run build

      # Optional: Auto-deploy to GitHub Pages or Cloudflare Pages
